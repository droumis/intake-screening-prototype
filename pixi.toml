[workspace]
name = "pisa"
description = "Participant Intake Screening Assistant"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.11.*"
panel = ">=1.4"
param = "*"
pydantic = ">=2"
httpx = "*"
python-docx = "*"
pdfplumber = "*"
jsonschema = "*"
pytest = "*"
watchfiles = "*"
pyyaml = "*"

[tasks]
app = "panel serve pisa/app.py --dev --show"
test = "pytest tests/"
# Everything that does not need a running Ollama server. This is what CI runs.
test-unit = "pytest tests/ -m 'not integration'"
eval = "python scripts/oracle_eval.py demo-data/"
seed = "python scripts/seed_demo.py demo-data/"
